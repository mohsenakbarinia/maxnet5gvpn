[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-config-pipeline"
version = "1.0.0"
description = "MAXNET5G Automated Free VPN Config Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
free-config-collect = "free_config_pipeline.collect:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
