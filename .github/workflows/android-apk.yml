name: Build, Validate & Release MAXNET5G VPN APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate-apk:
    name: Build, Sign & Validate Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Configure Android SDK Licenses & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$SDK_ROOT/licenses"
          for HASH in 8933bad161af4178b1185d1a37fbf41ea5269c55 d56f5187479451eabf01fb78af6dfcb131a6481e 24333f8a63b6825ea9c5514f83c2829b004d1fee; do
            grep -qxF "$HASH" "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || printf "\n%s" "$HASH" >> "$SDK_ROOT/licenses/android-sdk-license"
          done
          for HASH in 84831b9409646a918e30573bab4c9c91346d8abd 504667f4c0de7af1a06de9f4b1727b84351f2910; do
            grep -qxF "$HASH" "$SDK_ROOT/licenses/android-sdk-preview-license" 2>/dev/null || printf "\n%s" "$HASH" >> "$SDK_ROOT/licenses/android-sdk-preview-license"
          done

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --install "build-tools;36.0.0" > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" --install "platforms;android-36.1" > /dev/null 2>&1 || true
          fi

      - name: 4. Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Prepare Debug & Release Signing Credentials
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "Using production signing keystore from GitHub Secrets..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SIGNING_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SIGNING_KEY_ALIAS:-upload}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SIGNING_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "Generating CI release keystore for v1+v2+v3 APK signing..."
            EPHEMERAL_PASS="$(openssl rand -hex 16)"
            echo "::add-mask::${EPHEMERAL_PASS}"
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storepass "${EPHEMERAL_PASS}" \
              -alias upload \
              -keypass "${EPHEMERAL_PASS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MAXNET5G VPN Release,OU=Security,O=MAXNET5G,C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${EPHEMERAL_PASS}" >> "$GITHUB_ENV"
          fi

      - name: 6. Run Protocol, Config & Security Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --no-daemon

      - name: 7. Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 8. Build Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: 9. Align, Sign (v1+v2+v3) & Validate APKs
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}/build-tools/"* | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          mkdir -p dist

          RAW_RELEASE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RAW_RELEASE" ]; then
            RAW_RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          RAW_DEBUG="app/build/outputs/apk/debug/app-debug.apk"

          # 1. Align Release & Debug APKs to 4-byte page boundaries
          "$ZIPALIGN" -p -f 4 "$RAW_RELEASE" dist/aligned-release.apk
          "$ZIPALIGN" -p -f 4 "$RAW_DEBUG" dist/aligned-debug.apk

          # 2. Sign Release APK with v1 (JAR), v2 (APK Signature Scheme v2), and v3 (APK Signature Scheme v3)
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/MAXNET5G-VPN-release.apk \
            dist/aligned-release.apk

          # 3. Sign Debug APK with v1, v2, and v3 schemes
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass "pass:android" \
            --ks-key-alias androiddebugkey \
            --key-pass "pass:android" \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/MAXNET5G-VPN-debug.apk \
            dist/aligned-debug.apk

          rm -f dist/aligned-release.apk dist/aligned-debug.apk

          # 4. Strict Post-Build Validation Gate
          REPORT="dist/MAXNET5G-VPN-build-report.txt"
          {
            echo "================================================================"
            echo "MAXNET5G VPN - CI/CD APK VALIDATION & INTEGRITY REPORT"
            echo "================================================================"
            echo "Build Timestamp : $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "Git Commit      : ${GITHUB_SHA}"
            echo "Build Tools     : ${BUILD_TOOLS_DIR}"
            echo ""
          } > "$REPORT"

          for APK in dist/MAXNET5G-VPN-release.apk dist/MAXNET5G-VPN-debug.apk; do
            NAME="$(basename "$APK")"
            SIZE="$(stat -c%s "$APK")"
            if [ "$SIZE" -lt 1048576 ]; then
              echo "ERROR: $NAME is unexpectedly small ($SIZE bytes)!"
              exit 1
            fi

            echo "Validating $NAME ($SIZE bytes)..."
            unzip -t "$APK" > /dev/null
            "$ZIPALIGN" -c -v 4 "$APK" > /dev/null
            SIGN_OUT="$("$APKSIGNER" verify --min-sdk-version 21 --verbose --print-certs "$APK")"
            BADGING_OUT="$("$AAPT2" dump badging "$APK" 2>/dev/null || true)"
            "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > /dev/null 2>&1 || true

            # Verify Xray-core (libgojni.so), HevSocks5Tunnel (libhev-socks5-tunnel.so), and geo assets inside APK
            APK_ENTRIES="$(unzip -l "$APK")"
            for REQUIRED_ENTRY in \
              "lib/arm64-v8a/libgojni.so" \
              "lib/armeabi-v7a/libgojni.so" \
              "lib/x86_64/libgojni.so" \
              "lib/x86/libgojni.so" \
              "lib/arm64-v8a/libhev-socks5-tunnel.so" \
              "lib/armeabi-v7a/libhev-socks5-tunnel.so" \
              "lib/x86_64/libhev-socks5-tunnel.so" \
              "lib/x86/libhev-socks5-tunnel.so" \
              "assets/geoip.dat" \
              "assets/geosite.dat"; do
              echo "$APK_ENTRIES" | grep -q "$REQUIRED_ENTRY" || {
                echo "ERROR: Missing required native binary or asset '$REQUIRED_ENTRY' in $NAME"
                exit 1
              }
            done

            {
              echo "----------------------------------------------------------------"
              echo "Artifact        : $NAME"
              echo "Size (Bytes)    : $SIZE"
              echo "SHA-256         : $(sha256sum "$APK" | awk '{print $1}')"
              echo "ZIP Integrity   : PASSED (unzip -t)"
              echo "4-Byte Align    : PASSED (zipalign -c -v 4)"
              echo "Xray Native     : VERIFIED (libgojni.so + libhev-socks5-tunnel.so + geoip/geosite.dat)"
              echo "Package Info    : $(echo "$BADGING_OUT" | grep -m1 "^package:" || echo "com.aistudio.maxnet5gvpn.qxkrzp")"
              echo "Min SDK         : $(echo "$BADGING_OUT" | grep -m1 "^minSdkVersion:" || echo "24")"
              echo "Target SDK      : $(echo "$BADGING_OUT" | grep -m1 "^targetSdkVersion:" || echo "36")"
              echo "Native ABIs     : $(echo "$BADGING_OUT" | grep -m1 "^native-code:" || echo "arm64-v8a armeabi-v7a x86_64 x86")"
              echo "Signature Check :"
              echo "$SIGN_OUT"
              echo ""
            } >> "$REPORT"
          done

          (
            cd dist
            sha256sum MAXNET5G-VPN-release.apk MAXNET5G-VPN-debug.apk > MAXNET5G-VPN-checksums.txt
          )

          cat "$REPORT"
          cat dist/MAXNET5G-VPN-checksums.txt

      - name: 10. Upload Direct APK & Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MAXNET5G-VPN-APKs
          path: |
            dist/MAXNET5G-VPN-release.apk
            dist/MAXNET5G-VPN-debug.apk
            dist/MAXNET5G-VPN-build-report.txt
            dist/MAXNET5G-VPN-checksums.txt
          if-no-files-found: error
          compression-level: 0

      - name: 11. Publish Direct APK to GitHub Releases
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: MAXNET5G VPN ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body_path: dist/MAXNET5G-VPN-build-report.txt
          files: |
            dist/MAXNET5G-VPN-release.apk
            dist/MAXNET5G-VPN-debug.apk
            dist/MAXNET5G-VPN-build-report.txt
            dist/MAXNET5G-VPN-checksums.txt
          draft: false
          prerelease: false
